  if (!lat || !lng) return;
  if (!navigator.geolocation) {
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const url = `https://www.google.com/maps/dir/?api=1&origin=${pos.coords.latitude},${pos.coords.longitude}&destination=${lat},${lng}`;
      window.open(url, '_blank');

// ===== STATE =====
let currentLang = 'bn';
let currentCat = 'all';
let currentArea = 'all';

// ===== RENDER =====
function t(key) {
  return i18n[currentLang][key] || key;
}

function renderCards() {
  const container = document.getElementById('cards-container');
  const empty = document.getElementById('empty-state');
  const count = document.getElementById('results-count');

  const filtered = places.filter(p => {
    if (currentCat !== 'all' && p.cat !== currentCat) return false;
    if (currentArea !== 'all' && p.area !== currentArea) return false;
    return true;
  });

  count.textContent = `${filtered.length}${t('results')}`;

  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  container.innerHTML = filtered.map(p => {
    const name = p.name[currentLang] || p.name.en;
    const addr = p.address[currentLang] || p.address.en;
    const hours = p.hours[currentLang] || p.hours.en;
    const note = p.note[currentLang] || p.note.en;

    const halalBadge = p.halal
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800">☪️ ${t('halal_label')}</span>`
      : '';
    const vegBadge = p.vegNote
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-lime-100 text-lime-800">🥦 ${t('veg_label')}</span>`
      : '';
    const minorBadge = p.minor
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-100 text-purple-800">💎 ${t('minor_label')}</span>`
      : '';
    const priceBadge = p.price
      ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">${p.price}</span>`
      : '';

    const phoneHtml = p.phone
      ? `<div class="flex items-center gap-1 text-xs text-gray-500 mt-1"><span>📞</span><a href="tel:${p.phone}" class="text-blue-600 hover:underline">${p.phone}</a></div>`
      : '';

    const mapBtn = p.lat
      ? `<button onclick="openDirections(${p.lat}, ${p.lng})" class="inline-flex items-center gap-1 mt-3 px-3 py-1.5 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-700 active:bg-blue-800 transition font-medium cursor-pointer">🗺️ ${t('map_btn')}</button>`
      : (p.mapUrl ? `<a href="${p.mapUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 mt-3 px-3 py-1.5 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-700 transition font-medium">🌐 ${t('map_btn')}</a>` : '');

    return `
      <div class="card bg-white rounded-2xl border-2 ${p.color} p-4 flex flex-col gap-2">
        <div class="flex items-start gap-2">
          <span class="text-2xl mt-0.5">${p.icon}</span>
          <div class="flex-1 min-w-0">
            <h2 class="font-bold text-gray-900 text-sm leading-snug">${name}</h2>
            <p class="text-xs text-gray-500 mt-0.5">📍 ${addr}</p>
            ${phoneHtml}
          </div>
        </div>
        <div class="flex flex-wrap gap-1">
          ${halalBadge}${vegBadge}${minorBadge}${priceBadge}
        </div>
        <div class="text-xs text-gray-500 flex items-center gap-1">
          <span>🕐</span><span>${hours}</span>
        </div>
        <p class="text-xs text-gray-700 leading-relaxed">${note}</p>
        ${mapBtn}
      </div>
    `;
  }).join('');
}

function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.getElementById('header-title').textContent = t('header_title');
  document.getElementById('header-sub').textContent = t('header_sub');
  document.getElementById('area-all').textContent = t('area_all');
}

// ===== EVENT LISTENERS =====
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateI18n();
    renderCards();
  });
});

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentCat = btn.dataset.cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  });
});

document.querySelectorAll('.area-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentArea = btn.dataset.area;
    document.querySelectorAll('.area-btn').forEach(b => {
      b.classList.remove('active', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
      b.classList.add('bg-gray-50', 'text-gray-600', 'border-gray-200');
    });
    btn.classList.add('active', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
    btn.classList.remove('bg-gray-50', 'text-gray-600', 'border-gray-200');
    renderCards();
  });
});

// ===== INIT =====
renderCards();
</script>
</body>
</html>
